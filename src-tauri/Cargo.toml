[package]
name = "kmovies"
version = "5.0.0"
description = "K-Movies — catálogo de películas"
authors = ["Kobayashi82"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "kmovies_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
zstd = { version = "0.14.3", features = ["zstdmt"] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["sync", "time", "fs", "macros"] }
futures = "0.3"
walkdir = "2"
regex = "1"
flate2 = "1"
strsim = "0.11"
anyhow = "1"
trash = "5"
libloading = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
csv = "1.4.0"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
notify = { version = "8.2.0", default-features = false }
zstd = "0.14.3"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
