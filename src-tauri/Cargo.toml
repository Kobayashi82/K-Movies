[package]
name = "kmovies"
version = "5.0.0"
description = "K-Movies — catálogo de películas"
authors = ["Kobayashi82"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "kmovies_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["sync", "time", "fs"] }
futures = "0.3"
walkdir = "2"
regex = "1"
flate2 = "1"
strsim = "0.11"
anyhow = "1"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
